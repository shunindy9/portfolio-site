              - generic [ref=e102]: ↗
            - paragraph [ref=e103]: "Original score and sound design — analog psychedelic trip-hop: tape saturation, slow builds, climactic drops. Composition, sample packs, and sonic identity."
      - generic [ref=e105]:
        - generic [ref=e106]: Portrait
        - generic [ref=e107]:
          - paragraph [ref=e108]: 02 — About
          - heading "A short story." [level=2] [ref=e109]:
            - generic [ref=e111]: A short story.
          - paragraph [ref=e112]: "I'm Shunsuke — a creative director, designer, and technologist based in Tokyo. I grew up between two languages and two instincts: the precision of design and the warmth of analog sound. Most of my work lives in that overlap — restrained, cinematic, built to feel like Tokyo after midnight. I treat process as the product. A film, a site, an identity, a score — each one gets sourced, used, documented, and shaped until it earns its quiet, then its loud. References run from Massive Attack and Portishead to DJ Shadow and the hiss of 70s tape. I work in English and Japanese, with artists, labels, and brands building things meant to be felt."
